[project]
name = "einstein"
version = "0.1.0"
description = "Tools for exploring unified physics hypotheses"
requires-python = ">=3.11"

dependencies = [
    "sympy>=1.13",
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbmake>=1.5",
    "nbformat>=5.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["einstein*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
